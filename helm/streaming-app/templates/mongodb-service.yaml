{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "streaming-app.fullname" . }}-mongodb
spec:
  type: ClusterIP
  ports: [{ port: {{ .Values.mongodb.port }}, targetPort: {{ .Values.mongodb.port }} }]
  selector:
    {{- include "streaming-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
{{- end }}